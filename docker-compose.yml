services:
  kuro:
    build: .
    container_name: kuro
    restart: unless-stopped
    ports:
      - "4322:4321"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - TMDB_API_KEY=${TMDB_API_KEY}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-kuroadmin123}
      - SESSION_SECRET=${SESSION_SECRET:-}
    volumes:
      - ./data:/app/data
