<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0B" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="canonical" href="https://kuro.siddheshnaik.dev" />

    <!-- Primary Meta Tags -->
    <meta name="title" content="kuro. — Deterministic Horror Movie Discovery Engine" />
    <meta
      name="description"
      content="One film. One sentence. Three nightmares. Kuro is an open-source, deterministic horror movie discovery engine combining onnx semantic embeddings with multi-tier heuristic ranking."
    />
    <meta
      name="keywords"
      content="horror movies, horror discovery, horror film recommendations, semantic movie search, vector embeddings, gemma embeddings, sveltekit, tmdb horror, indie horror, asian horror"
    />
    <meta name="author" content="Siddhesh Naik" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kuro.siddheshnaik.dev/" />
    <meta property="og:title" content="kuro. — Deterministic Horror Movie Discovery Engine" />
    <meta
      property="og:description"
      content="One film. One sentence. Three nightmares. Semantic vector resonance meets heuristic ranking."
    />
    <meta property="og:image" content="https://kuro.siddheshnaik.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="kuro." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://kuro.siddheshnaik.dev/" />
    <meta name="twitter:title" content="kuro. — Deterministic Horror Movie Discovery Engine" />
    <meta
      name="twitter:description"
      content="One film. One sentence. Three nightmares. Semantic vector resonance meets heuristic ranking."
    />
    <meta name="twitter:image" content="https://kuro.siddheshnaik.dev/og-image.png" />
    <meta name="twitter:creator" content="@sidchigo" />

    <!-- Structured Data (JSON-LD) for Search, Answer & Generative Engines (SEO / AEO / GEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://kuro.siddheshnaik.dev/#website",
            "url": "https://kuro.siddheshnaik.dev/",
            "name": "kuro.",
            "description": "Deterministic horror movie discovery engine.",
            "publisher": {
              "@type": "Person",
              "name": "Siddhesh Naik",
              "url": "https://siddheshnaik.dev"
            }
          },
          {
            "@type": "WebApplication",
            "@id": "https://kuro.siddheshnaik.dev/#webapp",
            "name": "kuro.",
            "url": "https://kuro.siddheshnaik.dev/",
            "applicationCategory": "EntertainmentApplication",
            "operatingSystem": "All",
            "description": "Deterministic horror movie discovery engine powered by in-browser ONNX embeddings (EmbeddingGemma-300M) and multi-tier heuristic ranking.",
            "creator": {
              "@type": "Person",
              "name": "Siddhesh Naik",
              "url": "https://siddheshnaik.dev"
            },
            "codeRepository": "https://github.com/sidchigo/kuro",
            "featureList": [
              "Zero cold-start in-memory semantic search",
              "Local ONNX EmbeddingGemma-300M inference",
              "Multi-tier waterfall candidate retrieval",
              "Vibe resonance formula combining cosine similarity with TMDB heuristics",
              "Neo-brutalist Japanese editorial grid interface"
            ]
          }
        ]
      }
    </script>

    <!-- Google Fonts: Instrument Serif, IBM Plex Mono, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var reg of registrations) {
              reg.unregister();
            }
          });
        }
        try {
          var t = localStorage.getItem('kuro_theme');
          var themes = {
            crimson: { hex: '#E62E25', rgb: '230 46 37' },
            amber: { hex: '#FF6B00', rgb: '255 107 0' },
            acid: { hex: '#00E676', rgb: '0 230 118' }
          };
          if (t === 'custom') {
            var c = localStorage.getItem('kuro_custom_color') || '#A855F7';
            var clean = c.replace('#', '').trim();
            if (clean.length === 3) clean = clean.split('').map(function(ch) { return ch + ch; }).join('');
            var num = parseInt(clean, 16);
            if (!isNaN(num) && clean.length === 6) {
              var rgb = ((num >> 16) & 255) + ' ' + ((num >> 8) & 255) + ' ' + (num & 255);
              document.documentElement.setAttribute('data-theme', 'custom');
              document.documentElement.style.setProperty('--accent', c);
              document.documentElement.style.setProperty('--accent-rgb', rgb);
            }
          } else if (t && themes[t]) {
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.style.setProperty('--accent', themes[t].hex);
            document.documentElement.style.setProperty('--accent-rgb', themes[t].rgb);
          }
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body class="bg-[#0A0A0B] text-[#F2EFE9] antialiased" data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
